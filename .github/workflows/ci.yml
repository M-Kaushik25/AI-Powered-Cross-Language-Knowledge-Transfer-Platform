name: CI

on:
  push:
    branches: [ main, fix/full-remediation ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with ruff
      run: |
        ruff check backend/ tests/

    - name: Run test suite with pytest and coverage
      env:
        ENVIRONMENT: development
        JWT_SECRET: clrag-dev-secret-replace-in-production-2026-minimum-32-chars
      run: |
        pytest --cov=backend/services --cov-report=term-missing tests/
